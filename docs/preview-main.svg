<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="side" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <style>.ui{font-family:Arial,'Microsoft YaHei',sans-serif}.h{font-weight:800;fill:#0f172a}.m{fill:#64748b}.mono{font-family:Consolas,'Courier New',monospace}.math{font-family:'Times New Roman',serif;font-style:italic}</style>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="0" y="0" width="230" height="860" fill="url(#side)"/>
  <text x="26" y="48" class="ui" font-size="23" font-weight="800" fill="#fff">LocalMathOCR</text>
  <text x="26" y="74" class="ui" font-size="12" fill="#94a3b8">Local Formula OCR</text>
  <line x1="26" y1="94" x2="204" y2="94" stroke="#334155"/>
  <rect x="18" y="116" width="194" height="38" rx="10" fill="#1e293b"/><text x="40" y="140" class="ui" font-size="14" fill="#e2e8f0">上传与识别</text>
  <text x="40" y="184" class="ui" font-size="14" fill="#94a3b8">导出与字体</text><text x="40" y="222" class="ui" font-size="14" fill="#94a3b8">历史记录</text>
  <line x1="26" y1="258" x2="204" y2="258" stroke="#334155"/>
  <text x="26" y="288" class="ui" font-size="12" fill="#64748b">模型状态</text>
  <circle cx="36" cy="318" r="6" fill="#22c55e"/><text x="52" y="323" class="ui" font-size="13" fill="#e2e8f0">Pix2Tex ready</text>
  <circle cx="36" cy="348" r="6" fill="#3b82f6"/><text x="52" y="353" class="ui" font-size="13" fill="#94a3b8">LaTeX_OCR ready</text>
  <circle cx="36" cy="378" r="6" fill="#64748b"/><text x="52" y="383" class="ui" font-size="13" fill="#64748b">Uni disabled</text>

  <rect x="230" y="0" width="1210" height="56" fill="#fff" stroke="#e2e8f0"/>
  <text x="260" y="36" class="ui h" font-size="17">数学公式识别工作台</text>
  <circle cx="1346" cy="28" r="7" fill="#22c55e"/><text x="1334" y="33" class="ui m" font-size="12" text-anchor="end">SSE connected</text>

  <text x="270" y="96" class="ui h" font-size="16">选择识别模型</text>
  <g filter="url(#sh)">
    <rect x="270" y="112" width="250" height="88" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="290" y="140" class="ui h" font-size="15">基础版 Pix2Tex</text><text x="290" y="164" class="ui m" font-size="12">&lt;2GB · CPU 友好 · 当前使用</text><rect x="290" y="174" width="74" height="18" rx="9" fill="#2563eb"/><text x="306" y="187" class="ui" font-size="10" font-weight="800" fill="#fff">ready</text>
    <rect x="538" y="112" width="250" height="88" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="558" y="140" class="ui h" font-size="15">高精度 LaTeX_OCR</text><text x="558" y="164" class="ui m" font-size="12">4-6GB · GPU 推荐 · 可切换</text><rect x="558" y="174" width="74" height="18" rx="9" fill="#e0f2fe"/><text x="574" y="187" class="ui" font-size="10" font-weight="800" fill="#0369a1">ready</text>
    <rect x="806" y="112" width="250" height="88" rx="14" fill="#fff" stroke="#e2e8f0" opacity="0.72"/><text x="826" y="140" class="ui h" font-size="15">专业版 Uni-Equation</text><text x="826" y="164" class="ui m" font-size="12">&gt;8GB · 需要手动启用</text><rect x="826" y="174" width="98" height="18" rx="9" fill="#f1f5f9"/><text x="842" y="187" class="ui" font-size="10" font-weight="800" fill="#64748b">unavailable</text>
  </g>

  <rect x="270" y="236" width="548" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5" filter="url(#sh)"/>
  <text x="294" y="268" class="ui h" font-size="15">上传公式图片</text><circle cx="544" cy="342" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="532" y="354" class="ui" font-size="34" fill="#2563eb">↑</text>
  <text x="472" y="402" class="ui m" font-size="14">拖拽、点击或粘贴图片</text><text x="466" y="426" class="ui m" font-size="12">支持 JPG / PNG / WebP，自动预处理</text>

  <rect x="846" y="236" width="494" height="250" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/>
  <rect x="846" y="236" width="494" height="42" rx="18" fill="#f8fafc"/><rect x="846" y="260" width="494" height="18" fill="#f8fafc"/>
  <text x="870" y="263" class="ui h" font-size="14">LaTeX 编辑器</text>
  <text x="872" y="314" class="mono" font-size="14" fill="#8b5cf6">\frac</text><text x="918" y="314" class="mono" font-size="14" fill="#334155">{-b \pm \sqrt{b^2 - 4ac}}{2a}</text>
  <text x="872" y="348" class="mono" font-size="13" fill="#94a3b8">% 可直接编辑识别结果，右侧实时预览</text>
  <rect x="270" y="520" width="1310" height="1" fill="none"/>

  <rect x="270" y="526" width="548" height="190" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="294" y="560" class="ui h" font-size="15">识别历史</text>
  <rect x="294" y="580" width="218" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="312" y="606" class="ui m" font-size="11">2 分钟前 · Pix2Tex</text><text x="312" y="636" class="math" font-size="22" fill="#334155">E = mc²</text>
  <rect x="532" y="580" width="218" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="550" y="606" class="ui m" font-size="11">5 分钟前 · LaTeX_OCR</text><text x="550" y="636" class="math" font-size="20" fill="#334155">∫ e^{-x²} dx</text>

  <rect x="846" y="526" width="494" height="190" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="870" y="560" class="ui h" font-size="15">实时预览</text>
  <text x="1093" y="636" class="math" font-size="44" fill="#0f172a" text-anchor="middle">x =</text>
  <text x="1190" y="614" class="math" font-size="34" fill="#0f172a" text-anchor="middle">−b ± √(b²−4ac)</text><line x1="1086" y1="626" x2="1294" y2="626" stroke="#0f172a" stroke-width="2"/><text x="1190" y="664" class="math" font-size="34" fill="#0f172a" text-anchor="middle">2a</text>
</svg>
