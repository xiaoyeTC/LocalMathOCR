<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="460" rx="32" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">模型生命周期管理</text>
  <text x="60" y="106" font-family="Arial, sans-serif" font-size="18" fill="#475569">下载、加载、热切换、显存释放与 SSE 状态推送统一由 ModelManager 管理</text>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="70" y="180" width="170" height="78" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text x="112" y="228" fill="#1e3a8a">配置启用</text>

    <rect x="305" y="180" width="170" height="78" rx="18" fill="#fef3c7" stroke="#d97706"/>
    <text x="345" y="228" fill="#92400e">下载权重</text>

    <rect x="540" y="180" width="170" height="78" rx="18" fill="#dcfce7" stroke="#16a34a"/>
    <text x="581" y="228" fill="#166534">加载显存</text>

    <rect x="775" y="180" width="170" height="78" rx="18" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="820" y="228" fill="#5b21b6">激活模型</text>

    <rect x="1010" y="180" width="170" height="78" rx="18" fill="#fee2e2" stroke="#dc2626"/>
    <text x="1044" y="228" fill="#991b1b">释放旧模型</text>
  </g>

  <g stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)">
    <line x1="240" y1="219" x2="294" y2="219"/>
    <line x1="475" y1="219" x2="529" y2="219"/>
    <line x1="710" y1="219" x2="764" y2="219"/>
    <line x1="945" y1="219" x2="999" y2="219"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
    <text x="80" y="320">PRELOAD_MODELS / ENABLE_* / CHECKPOINT</text>
    <text x="315" y="320">SSE 推送 downloading + progress</text>
    <text x="548" y="320">asyncio.Lock 防止并发切换</text>
    <text x="785" y="320">active_model_id 全局唯一</text>
    <text x="1000" y="320">gc.collect + cuda.empty_cache</text>
  </g>
</svg>
