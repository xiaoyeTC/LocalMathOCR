<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="side" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <style>.ui{font-family:Arial,'Microsoft YaHei',sans-serif}.h{font-weight:800;fill:#0f172a}.m{fill:#64748b}.math{font-family:'Times New Roman',serif;font-style:italic}</style>
  </defs>
  <rect width="1440" height="760" fill="url(#bg)"/>
  <rect x="0" y="0" width="230" height="760" fill="url(#side)"/>
  <text x="26" y="48" class="ui" font-size="23" font-weight="800" fill="#fff">LocalMathOCR</text>
  <line x1="26" y1="78" x2="204" y2="78" stroke="#334155"/>
  <text x="40" y="120" class="ui" font-size="14" fill="#94a3b8">上传与识别</text>
  <rect x="18" y="138" width="194" height="38" rx="10" fill="#1e293b"/><text x="40" y="162" class="ui" font-size="14" fill="#e2e8f0">导出与字体</text>
  <text x="40" y="206" class="ui" font-size="14" fill="#94a3b8">历史记录</text>

  <rect x="230" y="0" width="1210" height="56" fill="#fff" stroke="#e2e8f0"/>
  <text x="260" y="36" class="ui h" font-size="17">导出与字体选择</text>

  <rect x="270" y="92" width="1070" height="290" rx="20" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="300" y="128" class="ui h" font-size="16">公式预览</text>
  <rect x="300" y="150" width="1010" height="198" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="686" y="244" class="math" font-size="50" fill="#0f172a" text-anchor="middle">x =</text>
  <text x="862" y="220" class="math" font-size="42" fill="#0f172a" text-anchor="middle">−b ± √(b²−4ac)</text><line x1="722" y1="234" x2="1004" y2="234" stroke="#0f172a" stroke-width="2.4"/><text x="862" y="276" class="math" font-size="42" fill="#0f172a" text-anchor="middle">2a</text>
  <text x="805" y="328" class="ui m" font-size="13" text-anchor="middle">当前字体：Times New Roman · 可导出 PNG / SVG</text>

  <text x="270" y="424" class="ui h" font-size="16">导出设置</text>
  <g filter="url(#sh)">
    <rect x="270" y="444" width="330" height="64" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="292" y="470" class="ui m" font-size="12">导出字体</text><text x="292" y="494" class="math" font-size="20" fill="#0f172a">Times New Roman</text><text x="566" y="486" class="ui m" font-size="18">▾</text>
    <rect x="626" y="444" width="190" height="64" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="648" y="470" class="ui m" font-size="12">导出格式</text><rect x="648" y="480" width="52" height="22" rx="8" fill="#2563eb"/><text x="665" y="495" class="ui" font-size="11" font-weight="800" fill="#fff">PNG</text><rect x="708" y="480" width="52" height="22" rx="8" fill="#f1f5f9"/><text x="724" y="495" class="ui m" font-size="11" font-weight="800">SVG</text>
    <rect x="842" y="444" width="190" height="64" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="864" y="470" class="ui m" font-size="12">缩放倍率</text><text x="864" y="494" class="ui h" font-size="19">2x</text>
    <rect x="1058" y="444" width="160" height="64" rx="14" fill="#2563eb"/><text x="1138" y="484" class="ui" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">导出文件</text>
  </g>

  <text x="270" y="560" class="ui h" font-size="16">导出效果对比</text>
  <g filter="url(#sh)">
    <rect x="270" y="582" width="310" height="98" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="292" y="614" class="ui m" font-size="12">默认 Times New Roman</text><text x="425" y="654" class="math" font-size="24" fill="#0f172a" text-anchor="middle">x=(-b±√Δ)/2a</text>
    <rect x="610" y="582" width="310" height="98" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="632" y="614" class="ui m" font-size="12">Cambria Math</text><text x="765" y="654" font-family="Cambria Math,serif" font-style="italic" font-size="24" fill="#0f172a" text-anchor="middle">x=(-b±√Δ)/2a</text>
    <rect x="950" y="582" width="310" height="98" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="972" y="614" class="ui m" font-size="12">STIX / Latin Modern</text><text x="1105" y="654" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#0f172a" text-anchor="middle">x=(-b±√Δ)/2a</text>
  </g>
</svg>
